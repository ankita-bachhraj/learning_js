<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><script>
        function display(){
            let obj=document.getElementById("demo");
            obj.style.color="red";
            obj.style.fontFamily="arial";
            obj.style.textDecorationLine="underline";
        }
    </script>
</head>
<body><button onclick="display()">Click me!</button>
    <h1 id="demo">Hello, World!</h1>
</body>
</html>
