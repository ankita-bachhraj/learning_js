<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="number" id="num1" placeholder="enter first number" style="background-color: bisque;margin-left: 20px;">
    <input type="number" id="num2" placeholder="enter second number" style="background-color: bisque; margin-left: 10px;"><br>
    <button onclick="addNumbers()">Add</button>
    <button onclick="multiplyNumbers()">Multiply</button>
    <p id="result"></p>
    <script>
        function addNumbers() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var sum = parseFloat(num1) + parseFloat(num2);
            document.getElementById("result").innerHTML = "Sum: " + sum;
        }

        function multiplyNumbers() {
            var num1 = document.getElementById("num1").value;
            var num2 = document.getElementById("num2").value;
            var product = parseFloat(num1) * parseFloat(num2);
            document.getElementById("result").innerHTML = "Product: " + product;
        }

    </script>
</body>
</html>
